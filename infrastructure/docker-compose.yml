services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: imvest
      POSTGRES_PASSWORD: imvest_dev_only
      POSTGRES_DB: imvest
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docs/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imvest"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
